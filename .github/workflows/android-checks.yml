name: Android preview build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-checks.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-checks.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing preview signer
        if: github.event_name != 'pull_request'
        env:
          PREVIEW_KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$PREVIEW_KEYSTORE"
          mkdir -p ~/.android
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Install pinned native tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Validate routes and build both APKs
        working-directory: android
        run: bash gradlew --no-daemon :patch-core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual APK and native decoder
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK, native alignment and test results
        run: python android/scripts/package_preview.py --out dist/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retro-Trans-Android
          path: |
            dist/android/*
            android/app/build/outputs/androidTest-results/connected/**
            android/patch-core/build/test-results/test/*.xml
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: error
      - name: Remove the ephemeral signing file
        if: always() && github.event_name != 'pull_request'
        run: rm -f ~/.android/debug.keystore
