name: Refresh patch catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional repository to validate; preserve all other catalog entries"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: patch-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate releases and generate catalog
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [ -n "$CATALOG_REPOSITORY" ]; then
            python -m retro_trans.catalog_builder --repo "$CATALOG_REPOSITORY"
          else
            python -m retro_trans.catalog_builder
          fi
      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet -- retro_trans/resources/catalog.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retro_trans/resources/catalog.json
          git commit -m 'Update verified patch catalog'
          git push
