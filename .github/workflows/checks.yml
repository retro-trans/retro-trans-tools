name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Install application dependencies
        run: python -m pip install -e .
      - name: Build pinned DCP engine
        run: python scripts/bundle_dcp.py --write
      - name: Test catalog, releases, UI, xdelta, CHD, saves and updater
        run: python -m unittest discover -s tests -v
      - name: Validate bundled catalog and offline engines
        run: python launch.py --health-check health.json
