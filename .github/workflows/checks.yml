name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalog, releases, UI, xdelta and updater
        run: python -m unittest discover -s tests -v
      - name: Validate bundled catalog and engine
        run: python launch.py --health-check health.json
