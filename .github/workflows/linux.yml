name: Linux portable build
on:
  push:
    branches: [codex/linux-release-0.5.22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mame-tools xvfb xauth libtk8.6 fonts-dejavu-core cmake ninja-build g++ pkg-config libudev-dev libusb-1.0-0-dev liblzma-dev libbz2-dev liblzo2-dev liblz4-dev libzstd-dev libcurl4-openssl-dev libmbedtls-dev libhidapi-dev
          python -m pip install pyinstaller==6.22.3 certifi==2026.7.22
          python -m pip install -e .
      - name: Build pinned RVZ helper
        run: python scripts/bundle_linux_dolphin.py
      - name: Build pinned DCP helper
        run: python scripts/bundle_dcp.py --rid linux-x64 --write
      - name: Test and build portable package
        env:
          GH_TOKEN: ${{ github.token }}
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: xvfb-run -a python scripts/build_linux.py
      - name: Test package without Python or installed engines
        run: |
          docker build -t retro-linux-smoke -f scripts/linux-smoke.Dockerfile .
          mkdir -p dist/clean-smoke
          chmod 777 dist/clean-smoke
          docker run --rm --network none --user 10001:10001 -v "$PWD/dist:/packages:ro" -v "$PWD/dist/clean-smoke:/results" retro-linux-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Retro-Trans-Linux-x86_64
          path: |
            dist/Retro-Trans-Linux-*.tar.gz
            dist/LINUX*.json
            dist/SHA256SUMS-Linux-*.txt
            dist/clean-smoke/*.json
          if-no-files-found: error
          retention-days: 30
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - run: python -m pip install -e .
      - run: python scripts/bundle_dcp.py --write
      - run: python -m unittest discover -s tests -v
