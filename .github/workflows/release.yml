name: Release Windows app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version tag
        shell: pwsh
        run: |
          $AppVersion = python -c "from retro_trans import __version__; print(__version__)"
          if ('${{ github.ref_name }}' -ne "v$AppVersion") { throw 'Run this workflow on the matching version tag.' }
      - name: Test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Python python
      - name: Check standalone runtime
        shell: pwsh
        run: |
          $Check = Start-Process -FilePath './dist/Retro-Trans.exe' -ArgumentList '--health-check','packaged-health.json' -WindowStyle Hidden -PassThru
          if (-not $Check.WaitForExit(45000)) { throw 'Packaged check timed out.' }
          $Report = Get-Content packaged-health.json -Raw | ConvertFrom-Json
          if (-not $Report.ok) { throw $Report.error }
      - name: Check next-launch update with packaged apps
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/check_packaged_update.py
      - name: Publish immutable app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Publish a new version instead of overwriting it.' }
          $NotesPath = 'docs/releases/${{ github.ref_name }}.md'
          $NotesArguments = if (Test-Path -LiteralPath $NotesPath) { @('--notes-file', $NotesPath) } else { @('--generate-notes') }
          gh release create '${{ github.ref_name }}' dist/Retro-Trans.exe dist/Retro-Trans-Windows.zip dist/UPDATE.json --repo '${{ github.repository }}' --verify-tag --title 'Retro Trans ${{ github.ref_name }}' @NotesArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
