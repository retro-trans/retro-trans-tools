[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-trans-tools"
dynamic = ["version"]
description = "Download verified retro-trans releases and patch local binaries"
requires-python = ">=3.10"
dependencies = ["certifi==2026.7.22; sys_platform == 'darwin' or sys_platform == 'linux'", "truststore==0.10.5; sys_platform == 'win32'", "cryptography==47.0.0"]

[project.gui-scripts]
retro-trans = "retro_trans.gui:main"

[tool.setuptools.packages.find]
include = ["retro_trans*"]

[tool.setuptools.dynamic]
version = {attr = "retro_trans.__version__"}

[tool.setuptools.package-data]
retro_trans = ["resources/*.json", "resources/*.zip", "resources/*.txt"]
