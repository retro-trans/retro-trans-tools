[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-trans-tools"
dynamic = ["version"]
description = "Download verified retro-trans releases and patch local binaries"
requires-python = ">=3.8"
dependencies = []

[project.gui-scripts]
retro-trans = "retro_trans.gui:main"

[tool.setuptools.packages.find]
include = ["retro_trans*"]

[tool.setuptools.dynamic]
version = {attr = "retro_trans.__version__"}

[tool.setuptools.package-data]
retro_trans = ["resources/*.json", "resources/*.zip", "resources/*.txt"]
